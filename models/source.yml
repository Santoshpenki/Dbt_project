version: 2

sources:
  - name: sales_source
    database: medina_np       # Optional if already defined in your profile
    schema: sales              # Change this if your schema is different
    description: "Raw data tables ingested from source systems."

    tables:
      - name: orders
        description: "Raw orders data from the ERP system."
        columns:
          - name: order_id
            description: "Primary key of the order."
            tests:
              - unique
              - not_null

          - name: customer_id
            description: "Foreign key referencing the customer placing the order."

          - name: order_date
            description: "The date the order was placed."

          - name: order_total
            description: "Total value of the order."

      - name: sales
        description: "Sales transaction data from point-of-sale systems."
        columns:
          - name: sale_id
            description: "Primary key of the sale."
            tests:
              - unique
              - not_null

          - name: order_id
            description: "Foreign key linking this sale to an order."
            tests:
              - relationships:
                  to: source('sales_source', 'orders')
                  field: order_id

          - name: product_id
            description: "Identifier of the product sold."

          - name: quantity
            description: "Quantity of items sold in the transaction."

          - name: total_amount
            description: "Total revenue generated by the sale."
