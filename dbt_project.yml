name: 'dbt_project'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_project:
    +database: medina_np

    stg:
      +schema: stg
      +materialized: view

    mart:
      +schema: mart
      +materialized: table

seeds:
  dbt_project:           # Match your project name
    +schema: seed_data   # Schema where seeds will be loaded
    +database: medina_np # Optional if same as models
    +quote_columns: true # Optional: quotes column names (for case sensitivity)
